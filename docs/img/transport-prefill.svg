<svg viewBox="0 0 1260 640" xmlns="http://www.w3.org/2000/svg" width="1260" role="img" aria-label="m10dis batched prefill: rows and results through pinned host memory, doorbell through multicast"><style>
.pcb{fill:#e3ece4;stroke:#7c9a84;stroke-width:1.5;stroke-dasharray:6 4}
.chip{fill:#fff;stroke:#33413a;stroke-width:1.4}
.plx{fill:#f6e7c8;stroke:#b4832a;stroke-width:2}.plx2{fill:#f6e7c8;stroke:#b4832a;stroke-width:1.5}
.card{fill:#f0f3f6;stroke:#5f7896;stroke-width:1.3}.gpu{fill:#e4ebf3;stroke:#5f7896;stroke-width:1.2}
.lead{fill:#cfdcec;stroke:#33507a;stroke-width:1.8}
.rtx{fill:#1f3a2c;stroke:#1f3a2c}.blk{fill:#294b3a;stroke:#8fb5a0;stroke-width:1}
.region{fill:#fff;stroke:#7c9a84;stroke-width:1.2}.regionG{fill:#eef1ee;stroke:#a7b5ab;stroke-width:1;stroke-dasharray:4 3}
.slotL{fill:#eaf4ee;stroke:#eaf4ee}.slotA{fill:none;stroke:#c9dcd0;stroke-width:1}
.req{stroke:#2f6db5;stroke-width:2;fill:none}.ret{stroke:#2e8b57;stroke-width:2.6;fill:none}
.ack{stroke:#2e8b57;stroke-width:1.3;stroke-dasharray:4 3;fill:none}.agg{stroke:#c4731c;stroke-width:1.6;fill:none}
.wireDash{stroke:#5d6a63;stroke-width:1.2;stroke-dasharray:3 4;fill:none}
text{fill:#1b2420;font-family:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif}
.h2{font-size:18px;font-weight:600}.h3{font-size:15px;font-weight:600}.lbl{font-size:13px}.lblB{font-size:12.5px;font-weight:600}
.small{font-size:11.5px;fill:#5d6a63}.tiny{font-size:10.5px;fill:#5d6a63}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;fill:#5d6a63}
.h3w{font-size:15px;font-weight:600;fill:#eaf4ee}.lblW{font-size:12.5px;fill:#eaf4ee}.lblWB{font-size:13px;font-weight:600;fill:#eaf4ee}.smallW{font-size:11.5px;fill:#c9dcd0}
.badge{font-size:12px;font-weight:700;fill:#fff}.leg{font-size:13px}
.tB{fill:#2f6db5}.tG{fill:#2e8b57}.tO{fill:#c4731c}
</style><defs><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c4731c"/></marker></defs><rect width="100%" height="100%" fill="#fbfcfa"/><text x="40" y="42" class="h2" text-anchor="start">Batched prefill (modes 8 and 9): bulk data through pinned host memory, only the doorbell through multicast</text><path d="M190,148 L190,96 L1070,96 L1070,146" class="req" marker-end="url(#aB)"/><circle cx="560" cy="96" r="9.5" fill="#2f6db5"/><text x="560" y="100.3" class="badge" text-anchor="middle">2</text><text x="578" y="88" class="small" text-anchor="start">doorbell: seq, mode, R through each card's multicast window (6 writes, no new PTE records)</text><rect x="40" y="148" width="300" height="300" rx="8" class="rtx"/><text x="58" y="174" class="h3w" text-anchor="start">RTX 3070 Ti</text><circle cx="70" cy="202" r="9.5" fill="#2f6db5"/><text x="70" y="206.3" class="badge" text-anchor="middle">1</text><text x="88" y="206" class="lblW" text-anchor="start">write the chunk's rows + slot header</text><text x="88" y="223" class="smallW" text-anchor="start">BF16, 5.2 KB per row</text><circle cx="70" cy="260" r="9.5" fill="#2f6db5"/><text x="70" y="264.3" class="badge" text-anchor="middle">2</text><text x="88" y="264" class="lblW" text-anchor="start">write the doorbell</text><text x="88" y="281" class="smallW" text-anchor="start">seq last</text><circle cx="70" cy="318" r="9.5" fill="#2e8b57"/><text x="70" y="322.3" class="badge" text-anchor="middle">7</text><text x="88" y="322" class="lblW" text-anchor="start">wait: 24 acks ≥ seq in own VRAM</text><text x="88" y="339" class="smallW" text-anchor="start">then check every reducer flag = seq</text><circle cx="70" cy="376" r="9.5" fill="#2e8b57"/><text x="70" y="380.3" class="badge" text-anchor="middle">7</text><text x="88" y="380" class="lblW" text-anchor="start">combine per row</text><text x="88" y="397" class="smallW" text-anchor="start">Σ 5 routed parts + gate · shared</text><rect x="440" y="148" width="380" height="300" rx="8" class="pcb"/><text x="458" y="172" class="h3" text-anchor="start">host RAM · pinned mailbox · 16.9 MB</text><text x="458" y="188" class="small" text-anchor="start">registered in the RTX and in all 24 workers</text><rect x="458" y="198" width="344" height="26" rx="3" class="regionG"/><text x="630" y="215" class="tiny" text-anchor="middle">24 legacy slots (CPU path, 384 KiB)</text><rect x="458" y="232" width="344" height="78" rx="3" class="region"/><text x="630" y="249" class="lblB" text-anchor="middle">request: x / ids / routes, up to 64 rows</text><rect x="470" y="258" width="158" height="42" rx="3" class="gpu"/><rect x="632" y="258" width="158" height="42" rx="3" class="gpu"/><text x="549" y="275" class="lbl" text-anchor="middle">slot 0 · rows 0–31</text><text x="549" y="292" class="tiny" text-anchor="middle">header {fmt, rows, layer, seq}</text><text x="711" y="275" class="lbl" text-anchor="middle">slot 1 · rows 32–63</text><text x="711" y="292" class="tiny" text-anchor="middle">header {fmt, rows, layer, seq}</text><rect x="458" y="318" width="344" height="26" rx="3" class="region"/><text x="630" y="335" class="lbl" text-anchor="middle">gate page (shared-expert gate per row)</text><rect x="458" y="352" width="344" height="44" rx="3" class="region"/><text x="630" y="370" class="lblB" text-anchor="middle">24 part areas × 64 rows</text><text x="630" y="387" class="tiny" text-anchor="middle">reduced FP32 rows from the 6 card leaders</text><rect x="458" y="404" width="344" height="30" rx="3" class="region"/><text x="630" y="423" class="lbl" text-anchor="middle">flag page: flag = seq per reducer, credits</text><rect x="920" y="148" width="300" height="300" rx="8" class="card"/><text x="938" y="174" class="h3" text-anchor="start">6 Tesla M10 · 24 workers</text><circle cx="950" cy="202" r="9.5" fill="#2f6db5"/><text x="950" y="206.3" class="badge" text-anchor="middle">3</text><text x="968" y="206" class="lbl" text-anchor="start">read the slot's rows over PCIe</text><text x="968" y="223" class="small" text-anchor="start">slot = seq &amp; 1, same rule as the RTX</text><circle cx="950" cy="260" r="9.5" fill="#c4731c"/><text x="950" y="264.3" class="badge" text-anchor="middle">4</text><text x="968" y="264" class="lbl" text-anchor="start">gate/up, down, then card sums</text><text x="968" y="281" class="small" text-anchor="start">peers → leader, fixed order</text><circle cx="950" cy="318" r="9.5" fill="#2e8b57"/><text x="950" y="322.3" class="badge" text-anchor="middle">5</text><text x="968" y="322" class="lbl" text-anchor="start">leaders + w20 write reduced rows</text><text x="968" y="339" class="small" text-anchor="start">into their part area, then flag = seq</text><circle cx="950" cy="376" r="9.5" fill="#2e8b57"/><text x="950" y="380.3" class="badge" text-anchor="middle">6</text><text x="968" y="380" class="lbl" text-anchor="start">every worker acknowledges</text><text x="968" y="397" class="small" text-anchor="start">seq into its slot in RTX VRAM</text><line x1="342" y1="270" x2="466" y2="270" class="req" marker-end="url(#aB)"/><circle cx="392" cy="256" r="9.5" fill="#2f6db5"/><text x="392" y="260.3" class="badge" text-anchor="middle">1</text><line x1="794" y1="280" x2="918" y2="280" class="req" marker-end="url(#aB)"/><circle cx="856" cy="266" r="9.5" fill="#2f6db5"/><text x="856" y="270.3" class="badge" text-anchor="middle">3</text><line x1="918" y1="374" x2="806" y2="374" class="ret" marker-end="url(#aG)"/><circle cx="862" cy="360" r="9.5" fill="#2e8b57"/><text x="862" y="364.3" class="badge" text-anchor="middle">5</text><line x1="918" y1="419" x2="806" y2="419" class="ret" marker-end="url(#aG)"/><line x1="456" y1="374" x2="344" y2="374" class="ret" marker-end="url(#aG)"/><circle cx="400" cy="360" r="9.5" fill="#2e8b57"/><text x="400" y="364.3" class="badge" text-anchor="middle">7</text><line x1="456" y1="419" x2="344" y2="419" class="ret" marker-end="url(#aG)"/><path d="M1070,448 L1070,478 L190,478 L190,452" class="ack" marker-end="url(#aG)"/><circle cx="560" cy="478" r="9.5" fill="#2e8b57"/><text x="560" y="482.3" class="badge" text-anchor="middle">6</text><text x="578" y="496" class="small" text-anchor="start">24 acknowledgements through the remapped return pages, as in decode</text><text x="40" y="540" class="leg" text-anchor="start">Why host memory: R rows would need about 1.3 · R remapped pages per returning worker, and the UVM table has 512 records (141 already used).</text><text x="40" y="562" class="leg" text-anchor="start">Mode 9 pipelines two 32-row slots. RTX stream order: P0 D0 P1 D1 W0 C0 P2 D2 W1 C1 …  (P publish rows, D doorbell, W wait for 24 acks, C combine).</text><text x="40" y="584" class="leg" text-anchor="start">A slot is rewritten only after its previous chunk was combined, so the RTX's publish and combine hide behind the M10 work (2.21 ms per chunk).</text><text x="40" y="606" class="leg" text-anchor="start">Results are bit-identical to the one-row path: every sum runs in the same fixed order.</text></svg>