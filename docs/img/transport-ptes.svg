<svg viewBox="0 0 1260 560" xmlns="http://www.w3.org/2000/svg" width="1260" role="img" aria-label="m10dis remapped GPU page-table entries"><style>
.pcb{fill:#e3ece4;stroke:#7c9a84;stroke-width:1.5;stroke-dasharray:6 4}
.chip{fill:#fff;stroke:#33413a;stroke-width:1.4}
.plx{fill:#f6e7c8;stroke:#b4832a;stroke-width:2}.plx2{fill:#f6e7c8;stroke:#b4832a;stroke-width:1.5}
.card{fill:#f0f3f6;stroke:#5f7896;stroke-width:1.3}.gpu{fill:#e4ebf3;stroke:#5f7896;stroke-width:1.2}
.lead{fill:#cfdcec;stroke:#33507a;stroke-width:1.8}
.rtx{fill:#1f3a2c;stroke:#1f3a2c}.blk{fill:#294b3a;stroke:#8fb5a0;stroke-width:1}
.region{fill:#fff;stroke:#7c9a84;stroke-width:1.2}.regionG{fill:#eef1ee;stroke:#a7b5ab;stroke-width:1;stroke-dasharray:4 3}
.slotL{fill:#eaf4ee;stroke:#eaf4ee}.slotA{fill:none;stroke:#c9dcd0;stroke-width:1}
.req{stroke:#2f6db5;stroke-width:2;fill:none}.ret{stroke:#2e8b57;stroke-width:2.6;fill:none}
.ack{stroke:#2e8b57;stroke-width:1.3;stroke-dasharray:4 3;fill:none}.agg{stroke:#c4731c;stroke-width:1.6;fill:none}
.wireDash{stroke:#5d6a63;stroke-width:1.2;stroke-dasharray:3 4;fill:none}
text{fill:#1b2420;font-family:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif}
.h2{font-size:18px;font-weight:600}.h3{font-size:15px;font-weight:600}.lbl{font-size:13px}.lblB{font-size:12.5px;font-weight:600}
.small{font-size:11.5px;fill:#5d6a63}.tiny{font-size:10.5px;fill:#5d6a63}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;fill:#5d6a63}
.h3w{font-size:15px;font-weight:600;fill:#eaf4ee}.lblW{font-size:12.5px;fill:#eaf4ee}.lblWB{font-size:13px;font-weight:600;fill:#eaf4ee}.smallW{font-size:11.5px;fill:#c9dcd0}
.badge{font-size:12px;font-weight:700;fill:#fff}.leg{font-size:13px}
.tB{fill:#2f6db5}.tG{fill:#2e8b57}.tO{fill:#c4731c}
</style><defs><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c4731c"/></marker></defs><rect width="100%" height="100%" fill="#fbfcfa"/><text x="40" y="42" class="h2" text-anchor="start">Remapped page-table entries: an ordinary device pointer that lands on another GPU</text><text x="190" y="80" class="lblB" text-anchor="middle">whose page table</text><text x="585" y="80" class="lblB" text-anchor="middle">device VA → 4 KiB leaf PTE</text><text x="1025" y="80" class="lblB" text-anchor="middle">rewritten PTE points at (physical PCIe address)</text><rect x="40" y="96" width="300" height="74" rx="6" class="rtx"/><text x="190" y="127" class="h3w" text-anchor="middle">RTX</text><text x="190" y="148" class="smallW" text-anchor="middle">vLLM engine process</text><rect x="420" y="96" width="330" height="74" rx="6" class="region"/><text x="585" y="124" class="lblB" text-anchor="middle">request pages</text><text x="585" y="142" class="small" text-anchor="middle">4 × 4 KiB per card · 24 in total</text><text x="585" y="159" class="tiny" text-anchor="middle">original PTE saved in a record</text><rect x="830" y="96" width="390" height="74" rx="6" class="plx2"/><text x="1025" y="127" class="lblB" text-anchor="middle">the card's multicast window</text><text x="1025" y="148" class="small" text-anchor="middle">→ PEX8747 → all 4 GPUs of that card</text><line x1="342" y1="133" x2="416" y2="133" stroke="#2f6db5" stroke-width="2.2" marker-end="url(#aB)"/><line x1="752" y1="133" x2="826" y2="133" stroke="#2f6db5" stroke-width="2.2" marker-end="url(#aB)"/><rect x="40" y="188" width="300" height="74" rx="6" class="card"/><text x="190" y="219" class="h3" text-anchor="middle">each of the 24 workers</text><text x="190" y="240" class="small" text-anchor="middle">M10 service process</text><rect x="420" y="188" width="330" height="74" rx="6" class="region"/><text x="585" y="216" class="lblB" text-anchor="middle">return pages</text><text x="585" y="234" class="small" text-anchor="middle">3 × 4 KiB per worker</text><text x="585" y="251" class="tiny" text-anchor="middle">original PTE saved in a record</text><rect x="830" y="188" width="390" height="74" rx="6" class="plx2"/><text x="1025" y="219" class="lblB" text-anchor="middle">that worker's return slot in RTX BAR1</text><text x="1025" y="240" class="small" text-anchor="middle">→ RTX VRAM, which the RTX polls locally</text><line x1="342" y1="225" x2="416" y2="225" stroke="#2e8b57" stroke-width="2.2" marker-end="url(#aG)"/><line x1="752" y1="225" x2="826" y2="225" stroke="#2e8b57" stroke-width="2.2" marker-end="url(#aG)"/><rect x="40" y="280" width="300" height="74" rx="6" class="card"/><text x="190" y="311" class="h3" text-anchor="middle">each card peer</text><text x="190" y="332" class="small" text-anchor="middle">M10 service process</text><rect x="420" y="280" width="330" height="74" rx="6" class="region"/><text x="585" y="308" class="lblB" text-anchor="middle">card-sum page</text><text x="585" y="326" class="small" text-anchor="middle">per peer</text><text x="585" y="343" class="tiny" text-anchor="middle">original PTE saved in a record</text><rect x="830" y="280" width="390" height="74" rx="6" class="plx2"/><text x="1025" y="311" class="lblB" text-anchor="middle">the card leader's BAR1 (+0x28000)</text><text x="1025" y="332" class="small" text-anchor="middle">→ leader's VRAM, read by the leader's sum</text><line x1="342" y1="317" x2="416" y2="317" stroke="#c4731c" stroke-width="2.2" marker-end="url(#aO)"/><line x1="752" y1="317" x2="826" y2="317" stroke="#c4731c" stroke-width="2.2" marker-end="url(#aO)"/><text x="379" y="380" class="tiny" text-anchor="middle">kernel store</text><text x="789" y="380" class="tiny" text-anchor="middle">PCIe write</text><rect x="40" y="396" width="1180" height="128" rx="8" class="pcb"/><text x="58" y="420" class="h3" text-anchor="start">Patched nvidia-uvm: guarded rewrite + a record table</text><text x="58" y="444" class="leg" text-anchor="start">• Every rewritten PTE is recorded: original value, owner, VA space. 512 records in total; a decode session uses 141 (24 request + 117 return and card sum).</text><text x="58" y="466" class="leg" text-anchor="start">• Restored at session close, by recover-peer-client from the route journal, or by REAP_DEAD once the owning VA space is gone.</text><text x="58" y="488" class="leg" text-anchor="start">• 4 KiB leaves only: with 64 KiB leaves the query path frees the big-page table before the write and the writes never arrive.</text><text x="58" y="510" class="leg" text-anchor="start">• CUDA offers no peer access between the RTX and the M10s; this is what makes a plain store cross between them.</text></svg>