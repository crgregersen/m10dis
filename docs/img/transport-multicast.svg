<svg viewBox="0 0 1260 560" xmlns="http://www.w3.org/2000/svg" width="1260" role="img" aria-label="m10dis PCIe multicast inside one M10 card"><style>
.pcb{fill:#e3ece4;stroke:#7c9a84;stroke-width:1.5;stroke-dasharray:6 4}
.chip{fill:#fff;stroke:#33413a;stroke-width:1.4}
.plx{fill:#f6e7c8;stroke:#b4832a;stroke-width:2}.plx2{fill:#f6e7c8;stroke:#b4832a;stroke-width:1.5}
.card{fill:#f0f3f6;stroke:#5f7896;stroke-width:1.3}.gpu{fill:#e4ebf3;stroke:#5f7896;stroke-width:1.2}
.lead{fill:#cfdcec;stroke:#33507a;stroke-width:1.8}
.rtx{fill:#1f3a2c;stroke:#1f3a2c}.blk{fill:#294b3a;stroke:#8fb5a0;stroke-width:1}
.region{fill:#fff;stroke:#7c9a84;stroke-width:1.2}.regionG{fill:#eef1ee;stroke:#a7b5ab;stroke-width:1;stroke-dasharray:4 3}
.slotL{fill:#eaf4ee;stroke:#eaf4ee}.slotA{fill:none;stroke:#c9dcd0;stroke-width:1}
.req{stroke:#2f6db5;stroke-width:2;fill:none}.ret{stroke:#2e8b57;stroke-width:2.6;fill:none}
.ack{stroke:#2e8b57;stroke-width:1.3;stroke-dasharray:4 3;fill:none}.agg{stroke:#c4731c;stroke-width:1.6;fill:none}
.wireDash{stroke:#5d6a63;stroke-width:1.2;stroke-dasharray:3 4;fill:none}
text{fill:#1b2420;font-family:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif}
.h2{font-size:18px;font-weight:600}.h3{font-size:15px;font-weight:600}.lbl{font-size:13px}.lblB{font-size:12.5px;font-weight:600}
.small{font-size:11.5px;fill:#5d6a63}.tiny{font-size:10.5px;fill:#5d6a63}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;fill:#5d6a63}
.h3w{font-size:15px;font-weight:600;fill:#eaf4ee}.lblW{font-size:12.5px;fill:#eaf4ee}.lblWB{font-size:13px;font-weight:600;fill:#eaf4ee}.smallW{font-size:11.5px;fill:#c9dcd0}
.badge{font-size:12px;font-weight:700;fill:#fff}.leg{font-size:13px}
.tB{fill:#2f6db5}.tG{fill:#2e8b57}.tO{fill:#c4731c}
</style><defs><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c4731c"/></marker></defs><rect width="100%" height="100%" fill="#fbfcfa"/><text x="40" y="42" class="h2" text-anchor="start">Multicast inside one M10 card: one write in, four writes out</text><text x="40" y="76" class="small" text-anchor="start">The card's prefetchable bridge window (read from a live sysfs scan, not to scale)</text><rect x="40" y="86" width="230" height="34" rx="3" class="gpu"/><text x="155.0" y="108" class="lbl" text-anchor="middle">GPU 0 BAR1</text><rect x="275" y="86" width="230" height="34" rx="3" class="gpu"/><text x="390.0" y="108" class="lbl" text-anchor="middle">GPU 1 BAR1</text><rect x="510" y="86" width="230" height="34" rx="3" class="gpu"/><text x="625.0" y="108" class="lbl" text-anchor="middle">GPU 2 BAR1</text><rect x="745" y="86" width="230" height="34" rx="3" class="gpu"/><text x="860.0" y="108" class="lbl" text-anchor="middle">GPU 3 BAR1</text><rect x="980" y="86" width="60" height="34" rx="3" class="regionG"/><rect x="1045" y="86" width="90" height="34" rx="3" class="plx2"/><text x="1090.0" y="108" class="lblB" text-anchor="middle">MC 64 KiB</text><rect x="1140" y="86" width="80" height="34" rx="3" class="regionG"/><text x="1090" y="136" class="tiny" text-anchor="middle">unused aligned gap → MC_BASE</text><rect x="236" y="88" width="22" height="30" rx="2" fill="#f6e7c8" stroke="#b4832a"/><rect x="471" y="88" width="22" height="30" rx="2" fill="#f6e7c8" stroke="#b4832a"/><rect x="706" y="88" width="22" height="30" rx="2" fill="#f6e7c8" stroke="#b4832a"/><rect x="941" y="88" width="22" height="30" rx="2" fill="#f6e7c8" stroke="#b4832a"/><text x="40" y="150" class="tiny" text-anchor="start">small orange marks: each GPU's request buffer, where the per-port overlay points</text><rect x="40" y="190" width="230" height="230" rx="8" class="rtx"/><text x="58" y="216" class="h3w" text-anchor="start">RTX 3070 Ti</text><text x="58" y="244" class="lblW" text-anchor="start">publish kernel stores the</text><text x="58" y="262" class="lblW" text-anchor="start">request into its remapped</text><text x="58" y="280" class="lblW" text-anchor="start">pages: the target address</text><text x="58" y="298" class="lblW" text-anchor="start">is inside the MC window</text><text x="58" y="330" class="smallW" text-anchor="start">one posted write per card,</text><text x="58" y="346" class="smallW" text-anchor="start">through the PEX8748</text><text x="58" y="378" class="smallW" text-anchor="start">seq word written last</text><line x1="272" y1="300" x2="382" y2="300" class="req" marker-end="url(#aB)"/><text x="327" y="290" class="small" text-anchor="middle">1 write</text><rect x="385" y="180" width="380" height="250" rx="8" class="plx"/><text x="403" y="206" class="h3" text-anchor="start">PEX8747 on the M10 card</text><text x="403" y="224" class="small" text-anchor="start">PCIe Multicast capability, one group per card</text><rect x="403" y="237" width="344" height="40" rx="3" class="region"/><text x="413" y="254" class="mono" text-anchor="start">MC_BASE</text><text x="413" y="270" class="lbl" text-anchor="start">the 64 KiB window (index 16) in the gap above</text><rect x="403" y="283" width="344" height="40" rx="3" class="region"/><text x="413" y="300" class="mono" text-anchor="start">MC_RECEIVE</text><text x="413" y="316" class="lbl" text-anchor="start">the card's 4 GPU ports receive the group</text><rect x="403" y="329" width="344" height="40" rx="3" class="region"/><text x="413" y="346" class="mono" text-anchor="start">MC_OVERLAY</text><text x="413" y="362" class="lbl" text-anchor="start">per port: window → that GPU's request buffer</text><rect x="403" y="375" width="344" height="40" rx="3" class="region"/><text x="413" y="392" class="mono" text-anchor="start">ACS</text><text x="413" y="408" class="lbl" text-anchor="start">request/completion redirect cleared on the ports</text><line x1="767" y1="305" x2="900" y2="206" class="req" marker-end="url(#aB)"/><rect x="902" y="180" width="318" height="52" rx="4" class="gpu"/><text x="918" y="201" class="lblB" text-anchor="start">GM107 · GPU 0</text><text x="918" y="220" class="small" text-anchor="start">copy lands in its BAR1 request buffer</text><line x1="767" y1="305" x2="900" y2="270" class="req" marker-end="url(#aB)"/><rect x="902" y="244" width="318" height="52" rx="4" class="gpu"/><text x="918" y="265" class="lblB" text-anchor="start">GM107 · GPU 1</text><text x="918" y="284" class="small" text-anchor="start">copy lands in its BAR1 request buffer</text><line x1="767" y1="305" x2="900" y2="334" class="req" marker-end="url(#aB)"/><rect x="902" y="308" width="318" height="52" rx="4" class="gpu"/><text x="918" y="329" class="lblB" text-anchor="start">GM107 · GPU 2</text><text x="918" y="348" class="small" text-anchor="start">copy lands in its BAR1 request buffer</text><line x1="767" y1="305" x2="900" y2="398" class="req" marker-end="url(#aB)"/><rect x="902" y="372" width="318" height="52" rx="4" class="gpu"/><text x="918" y="393" class="lblB" text-anchor="start">GM107 · GPU 3</text><text x="918" y="412" class="small" text-anchor="start">copy lands in its BAR1 request buffer</text><text x="830" y="172" class="small" text-anchor="middle">4 copies, address rewritten per port</text><text x="40" y="468" class="leg" text-anchor="start">Only posted writes are replicated. Reads and completions aren't, so every worker returns its own result.</text><text x="40" y="490" class="leg" text-anchor="start">pex_group_config.py finds the capability by walking the extended-capability list, checks each overlay against the GPU's live BAR1,</text><text x="40" y="512" class="leg" text-anchor="start">snapshots every multicast register before a session and restores it afterwards. The RTX writes 6 times; 24 GPUs receive the request.</text></svg>