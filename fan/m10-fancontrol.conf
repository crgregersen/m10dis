# Six Tesla M10 shroud fan banks. Never add NCT pwm2 (the CPU fan).
# Two banks are connected to the motherboard NCT6683 and four to the Arctic
# USB controller. All six follow the hottest dynamically discovered M10, so
# card enumeration changes do not change thermal coverage.
INTERVAL=5
FCTEMPS=/run/m10-hwmon/pwm3=!/usr/local/libexec/m10-max-temp /run/m10-hwmon/pwm1=!/usr/local/libexec/m10-max-temp /run/m10-arctic-hwmon/pwm1=!/usr/local/libexec/m10-max-temp /run/m10-arctic-hwmon/pwm2=!/usr/local/libexec/m10-max-temp /run/m10-arctic-hwmon/pwm3=!/usr/local/libexec/m10-max-temp /run/m10-arctic-hwmon/pwm4=!/usr/local/libexec/m10-max-temp
FCFANS=/run/m10-hwmon/pwm3=/run/m10-hwmon/fan4_input /run/m10-hwmon/pwm1=/run/m10-hwmon/fan1_input /run/m10-arctic-hwmon/pwm1=/run/m10-arctic-hwmon/fan1_input /run/m10-arctic-hwmon/pwm2=/run/m10-arctic-hwmon/fan2_input /run/m10-arctic-hwmon/pwm3=/run/m10-arctic-hwmon/fan3_input /run/m10-arctic-hwmon/pwm4=/run/m10-arctic-hwmon/fan4_input
MINTEMP=/run/m10-hwmon/pwm3=55 /run/m10-hwmon/pwm1=55 /run/m10-arctic-hwmon/pwm1=55 /run/m10-arctic-hwmon/pwm2=55 /run/m10-arctic-hwmon/pwm3=55 /run/m10-arctic-hwmon/pwm4=55
# All six M10 fan banks use the same curve: PWM 20 through 45 C,
# ramping to PWM 200 at 70 C.
MAXTEMP=/run/m10-hwmon/pwm3=70 /run/m10-hwmon/pwm1=70 /run/m10-arctic-hwmon/pwm1=70 /run/m10-arctic-hwmon/pwm2=70 /run/m10-arctic-hwmon/pwm3=70 /run/m10-arctic-hwmon/pwm4=70
MINSTART=/run/m10-hwmon/pwm3=120 /run/m10-hwmon/pwm1=120 /run/m10-arctic-hwmon/pwm1=120 /run/m10-arctic-hwmon/pwm2=120 /run/m10-arctic-hwmon/pwm3=120 /run/m10-arctic-hwmon/pwm4=120
MINSTOP=/run/m10-hwmon/pwm3=20 /run/m10-hwmon/pwm1=20 /run/m10-arctic-hwmon/pwm1=20 /run/m10-arctic-hwmon/pwm2=20 /run/m10-arctic-hwmon/pwm3=20 /run/m10-arctic-hwmon/pwm4=20
MINPWM=/run/m10-hwmon/pwm3=20 /run/m10-hwmon/pwm1=20 /run/m10-arctic-hwmon/pwm1=20 /run/m10-arctic-hwmon/pwm2=20 /run/m10-arctic-hwmon/pwm3=20 /run/m10-arctic-hwmon/pwm4=20
MAXPWM=/run/m10-hwmon/pwm3=200 /run/m10-hwmon/pwm1=200 /run/m10-arctic-hwmon/pwm1=200 /run/m10-arctic-hwmon/pwm2=200 /run/m10-arctic-hwmon/pwm3=200 /run/m10-arctic-hwmon/pwm4=200
AVERAGE=/run/m10-hwmon/pwm3=3 /run/m10-hwmon/pwm1=3 /run/m10-arctic-hwmon/pwm1=3 /run/m10-arctic-hwmon/pwm2=3 /run/m10-arctic-hwmon/pwm3=3 /run/m10-arctic-hwmon/pwm4=3
